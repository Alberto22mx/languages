<div id="contenedor">
  <div id="contenedor-title">
    <div>
      <h1 class="mat-h1">EXAMENES</h1>
    </div>
    <div>
    </div>
  </div>
  <div>
    <mat-stepper orientation="vertical" *ngIf="grupos">
      <!-- Paso fijo (solo aparece si no hay grupos) -->
      <mat-step *ngIf="!grupos || grupos.length === 0">
        <ng-template matStepLabel>Cargando datos..</ng-template>
        <ng-template matStepContent>
        </ng-template>
      </mat-step>
    
      <!-- Pasos dinámicos (aparecen cuando hay grupos) -->
      <mat-step *ngFor="let grupo of grupos">
        <ng-template matStepLabel>
          {{ grupo.nameGroup + ' ' + grupo.level + ' ' + grupo.course }}
        </ng-template>
        <ng-template matStepContent>
          <mat-list role="list">
            <mat-list-item 
              role="listitem" 
              *ngFor="let exam of grupo.exams" 
              class="hoverable"
              (click)="openEdit(exam)">
              {{ exam.title }}
              <small *ngIf="examStatuses[exam.id || '']?.score !== undefined">
                · Calificación: {{ examStatuses[exam.id || ''].score }}/100
              </small>
              <small *ngIf="examStatuses[exam.id || '']?.createdAt && examStatuses[exam.id || '']?.score === undefined">
                · Entregado, pendiente de calificación
              </small>
            </mat-list-item>
          </mat-list>
          <button mat-button matStepperNext>Next</button>
        </ng-template>
      </mat-step>
    </mat-stepper>
       
  </div>
</div>
