<h2 mat-dialog-title>Revisar examen: {{ data.exam.title }}</h2>
<mat-dialog-content>
  <p>Marca cada respuesta como correcta. La calificación se calcula automáticamente sobre 100.</p>
  <section *ngFor="let question of data.exam.questions; let index = index" class="question">
    <h3>{{ index + 1 }}. {{ question.questionText }}</h3>
    <p><strong>Respuesta del alumno:</strong> {{ formatAnswer(question.id) }}</p>
    <mat-checkbox [(ngModel)]="evaluations[question.id]">Respuesta correcta</mat-checkbox>
  </section>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Comentarios para el alumno</mat-label>
    <textarea matInput rows="3" [(ngModel)]="feedback"></textarea>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-raised-button color="primary" (click)="save()">Guardar evaluación</button>
</mat-dialog-actions>
