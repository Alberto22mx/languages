<div id="contenedor">
  <div id="contenedor-title">
    <div>
      <h3>ADMINISTRACION DE GRUPOS</h3>
    </div>
    <div>
      <button mat-flat-button color="primary" (click)="openDialogCreate()">CREAR GRUPO</button>
    </div>
  </div>
  <div>
    <mat-form-field class="w-100">
      <mat-label>Filtro</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Buscar..." #input>
    </mat-form-field>
    
    <table mat-table [dataSource]="dataSource" multiTemplateDataRows class="mat-elevation-z8">
      <!-- Columna Expandible -->
      <ng-container matColumnDef="expand">
        <th mat-header-cell *matHeaderCellDef aria-label="row actions">&nbsp;</th>
        <td mat-cell *matCellDef="let group">
          <button mat-icon-button aria-label="expand row" (click)="expandedElement = expandedElement === group ? null : group">
            <mat-icon *ngIf="expandedElement !== group">keyboard_arrow_down</mat-icon>
            <mat-icon *ngIf="expandedElement === group">keyboard_arrow_up</mat-icon>
          </button>
        </td>
      </ng-container>
    
      <!-- Columnas existentes -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Grupo </th>
        <td mat-cell *matCellDef="let group"> {{group.nameGroup}} </td>
      </ng-container>
    
      <ng-container matColumnDef="level">
        <th mat-header-cell *matHeaderCellDef> Nivel </th>
        <td mat-cell *matCellDef="let group"> {{group.level}} </td>
      </ng-container>
    
      <ng-container matColumnDef="schedule">
        <th mat-header-cell *matHeaderCellDef> Horario </th>
        <td mat-cell *matCellDef="let group"> {{group.schedule}} </td>
      </ng-container>
    
      <ng-container matColumnDef="state">
        <th mat-header-cell *matHeaderCellDef> Estado </th>
        <td mat-cell *matCellDef="let group"> {{group.state}} </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef > Acciones </th>
        <td mat-cell *matCellDef="let group"> 
          <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu" (click)="$event.stopPropagation()">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="openDialogAssign(group.id)">
              <mat-icon>edit</mat-icon>
              <span>Asignación</span>
            </button>
            <button mat-menu-item disabled>
              <mat-icon>voicemail</mat-icon>
              <span>Check voice mail</span>
            </button>
            <button mat-menu-item>
              <mat-icon>notifications_off</mat-icon>
              <span>Disable alerts</span>
            </button>
          </mat-menu>
        </td>
      </ng-container>
    
      <!-- Columna expandible con detalles -->
      <ng-container matColumnDef="expandedDetail">
        <td mat-cell *matCellDef="let group" [attr.colspan]="displayedColumns.length">
          <div class="example-element-detail" [@detailExpand]="group == expandedElement ? 'expanded' : 'collapsed'">
            <div class="row p-4">
              <div class="col-md-6">
                <mat-card>
                  <mat-card-header>
                    <mat-card-title>Información Detallada</mat-card-title>
                  </mat-card-header>
                  <mat-card-content>
                    <p><strong>Descripción:</strong> {{group.description}}</p>
                  </mat-card-content>
                </mat-card>
              </div>
            </div>
          </div>
        </td>
      </ng-container>
    
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let group; columns: displayedColumns;"
          class="example-element-row"
          [class.example-expanded-row]="expandedElement === group"
          (click)="expandedElement = expandedElement === group ? null : group">
      </tr>
      <tr mat-row *matRowDef="let group; columns: ['expandedDetail']" class="example-detail-row"></tr>
    </table>
    
    <mat-paginator [length]="totalGroups" [pageSize]="pageSize" (page)="onPageChange($event)">
    </mat-paginator>
  </div>
</div>
