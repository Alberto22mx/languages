<div class="modal-container">
  <div class="modal-content">
    <div class="container">
      <div class="list-container">
        <div class="header">
          <p class="title">ASIGNADOS</p>
          <mat-form-field appearance="outline" class="small-input">
            <mat-label>Buscar</mat-label>
            <input matInput (keyup)="applyFilter($event, 'items1')" placeholder="Buscar en asignados" />
          </mat-form-field>
        </div>
        <div
          cdkDropList
          #listaUno="cdkDropList"
          [cdkDropListData]="items1"
          [cdkDropListConnectedTo]="[listaDos]"
          class="list"
          (cdkDropListDropped)="drop($event)"
        >
          <div class="list-item" *ngFor="let item of paginatedItems1" cdkDrag>
            <span *ngIf="item.name">{{ item.name }}</span> <span *ngIf="item.registrationNumber">{{ ' - ' + item.registrationNumber }}</span>
          </div>
        </div>
        <mat-paginator
          [length]="filteredItems1.length"
          [pageSize]="5"
          [pageSizeOptions]="[5, 10, 20]"
          (page)="onPageChange($event, 'items1')"
        ></mat-paginator>
      </div>

      <div class="list-container">
        <div class="header">
          <p class="title">SIN ASIGNAR</p>
          <mat-form-field appearance="outline" class="compact-input">
            <mat-label>Buscar</mat-label>
            <input matInput (keyup)="applyFilter($event, 'items2')" placeholder="Buscar en sin asignar" />
          </mat-form-field>
        </div>
        <div
          cdkDropList
          #listaDos="cdkDropList"
          [cdkDropListData]="items2"
          [cdkDropListConnectedTo]="[listaUno]"
          class="list"
          (cdkDropListDropped)="drop($event)"
        >
          <div class="list-item" *ngFor="let item of paginatedItems2" cdkDrag>
            <span *ngIf="item.name">{{ item.name }}</span> <span *ngIf="item.registrationNumber">{{ ' - ' + item.registrationNumber }}</span>
          </div>
        </div>
        <mat-paginator
          [length]="filteredItems2.length"
          [pageSize]="5"
          [pageSizeOptions]="[5, 10, 20]"
          (page)="onPageChange($event, 'items2')"
        ></mat-paginator>
      </div>
    </div>
  </div>
</div>
