<div class="container">
  <div class="list-container">
    <h2>ASIGNADOS</h2>
    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Buscar</mat-label>
      <input matInput (keyup)="applyFilter($event, 'items1')" placeholder="Buscar en asignados" />
    </mat-form-field>
    <div
      cdkDropList
      #listaUno="cdkDropList"
      [cdkDropListData]="items1"
      [cdkDropListConnectedTo]="[listaDos]"
      class="list"
      (cdkDropListDropped)="drop($event)"
    >
      <div class="list-item" *ngFor="let item of filteredItems1" cdkDrag>
        <div>
          <strong *ngIf="item.name">Nombre:</strong> <span *ngIf="item.name">{{ item.name }}</span><br />
          <strong *ngIf="item.title">Título:</strong> <span *ngIf="item.title">{{ item.title }}</span><br />
          <strong *ngIf="item.registrationNumber">Matrícula:</strong> <span *ngIf="item.registrationNumber">{{ item.registrationNumber }}</span>
        </div>
      </div>
    </div>
  </div>

  <div class="list-container">
    <h2>POR ASIGNAR</h2>
    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Buscar</mat-label>
      <input matInput (keyup)="applyFilter($event, 'items2')" placeholder="Buscar en por asignar" />
    </mat-form-field>
    <div
      cdkDropList
      #listaDos="cdkDropList"
      [cdkDropListData]="items2"
      [cdkDropListConnectedTo]="[listaUno]"
      class="list"
      (cdkDropListDropped)="drop($event)"
    >
      <div class="list-item" *ngFor="let item of filteredItems2" cdkDrag>
        <div>
          <strong *ngIf="item.name">Nombre: </strong> <span *ngIf="item.name">{{ item.name }}</span><br />
          <strong *ngIf="item.title">Título: </strong> <span *ngIf="item.title">{{ item.title }}</span><br />
          <strong *ngIf="item.registrationNumber">Matrícula: </strong> <span *ngIf="item.registrationNumber">{{ item.registrationNumber }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
